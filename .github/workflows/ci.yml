name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test source tree
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Test installed wheel
        run: |
          python -m venv /tmp/icc-venv
          /tmp/icc-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/icc-venv/bin/python -c "import inference_capacity_contract; print(inference_capacity_contract.__all__)"
          /tmp/icc-venv/bin/python -m inference_capacity_contract --help
