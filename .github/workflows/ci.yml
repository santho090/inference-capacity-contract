name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test source tree
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Test installed wheel
        run: |
          python -m venv /tmp/icc-venv
          /tmp/icc-venv/bin/python -m pip install --no-deps dist/*.whl
          /tmp/icc-venv/bin/python -c "import inference_capacity_contract; print(inference_capacity_contract.__all__)"
          /tmp/icc-venv/bin/icc --help
          /tmp/icc-venv/bin/icc inspect-model --help
          /tmp/icc-venv/bin/icc resolve-model --help
          /tmp/icc-venv/bin/icc plan-model --help
          /tmp/icc-venv/bin/icc plan \
            --model docs/fixtures/model-7b.json \
            --hardware docs/fixtures/hardware-h100.json \
            --runtime docs/fixtures/runtime-vllm.json \
            --output /tmp/icc-contract.json
          /tmp/icc-venv/bin/icc validate --contract /tmp/icc-contract.json
          /tmp/icc-venv/bin/icc audit \
            --recipe docs/fixtures/serving-recipe-hybrid-tp8.json \
            --load docs/fixtures/load-context-concurrency.json \
            --output /tmp/icc-audit.json
          /tmp/icc-venv/bin/icc import-llmd \
            --values docs/fixtures/llmd-values-long-context-tp8.json \
            --hardware docs/fixtures/hardware-accelerator-x8-288gb.json \
            --output /tmp/icc-draft.json
          /tmp/icc-venv/bin/icc audit-draft \
            --draft /tmp/icc-draft.json \
            --output /tmp/icc-structural-audit.json
          /tmp/icc-venv/bin/icc import-vllm-init \
            --input docs/fixtures/vllm-initialization.json \
            --source benchmark://ci-initialization \
            --output /tmp/icc-initialization.json
          /tmp/icc-venv/bin/icc import-model-manifest \
            --repo-id example/long-context-moe \
            --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --config docs/fixtures/model-config-long-context-moe.json \
            --safetensors-index docs/fixtures/model-safetensors-index-long-context-moe.json \
            --output /tmp/icc-manifest.json
          /tmp/icc-venv/bin/icc materialize-recipe \
            --draft /tmp/icc-draft.json \
            --manifest /tmp/icc-manifest.json \
            --initialization /tmp/icc-initialization.json \
            --precise-prefix-routing \
            --output /tmp/icc-materialized-recipe.json
          /tmp/icc-venv/bin/icc audit \
            --recipe /tmp/icc-materialized-recipe.json \
            --load docs/fixtures/load-context-concurrency.json \
            --output /tmp/icc-materialized-audit.json
          /tmp/icc-venv/bin/icc explore \
            --model docs/fixtures/model-7b.json \
            --providers docs/fixtures/provider-inventory.json \
            --runtimes docs/fixtures/runtime-inventory.json \
            --context-tokens 8192 \
            --output /tmp/icc-exploration.json
          /tmp/icc-venv/bin/icc plan-providers \
            --model docs/fixtures/model-7b.json \
            --providers docs/fixtures/provider-inventory.json \
            --runtimes docs/fixtures/runtime-inventory.json \
            --load docs/fixtures/load-provider-plan.json \
            --output /tmp/icc-provider-plan.json
          /tmp/icc-venv/bin/icc plan-providers \
            --manifest docs/fixtures/model-manifest-long-context.json \
            --providers docs/fixtures/provider-inventory-long-context.json \
            --runtimes docs/fixtures/runtime-inventory-long-context.json \
            --load docs/fixtures/load-context-concurrency.json \
            --output /tmp/icc-long-context-plan.json
