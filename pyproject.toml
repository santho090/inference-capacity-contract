[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "inference-capacity-contract"
version = "0.1.0"
description = "Deterministic, evidence-aware capacity contracts for LLM model and hardware fit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Santhosh Vaithiyanathan" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
icc = "inference_capacity_contract.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "build_backend.py"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
